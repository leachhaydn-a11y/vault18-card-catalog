site_name: Vault18 Card Catalog
site_description: A comprehensive catalog of trading card collections
theme:
  name: material
  palette:
    scheme: slate
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate

nav:
  - Home: index.md
  - Collections:
    - Magic: The Gathering: mtg/index.md
    - Pokémon: pokemon/index.md
    - Yu-Gi-Oh!: yugioh/index.md
    - Lorcana: lorcana/index.md
    - One Piece: onepiece/index.md
  - Bulk Storage: bulk/index.md

plugins:
  - search
